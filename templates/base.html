<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="{% block meta_description %}{{ profile.display_name }} — Software Engineer{% endblock %}">
    <meta name="theme-color" content="#0a0a0f">

    <title>{% block title %}{{ profile.display_name }}{% endblock %}</title>

    <style>
        /* ========================================
           DESIGN SYSTEM
           ======================================== */

        :root {
            /* Colors */
            --bg: #0a0a0f;
            --surface: #13131a;
            --surface-hover: #18181f;
            --border: #1e1e2e;
            --border-light: #252535;
            --text-primary: #e4e4ed;
            --text-secondary: #8888a0;
            --text-muted: #555568;
            --accent: #6c5ce7;
            --accent-glow: #a78bfa;
            --accent-bg: rgba(108, 92, 231, 0.08);
            --accent-border: rgba(108, 92, 231, 0.25);
            --success: #00d2a0;
            --code: #ffd700;

            /* Typography */
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;

            /* Spacing (multiples of 4px) */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 48px;
            --space-3xl: 64px;

            /* Borders */
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-full: 9999px;

            /* Shadows */
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 40px rgba(108, 92, 231, 0.08);
            --shadow-button: 0 0 20px rgba(108, 92, 231, 0.15);

            /* Transitions */
            --transition-fast: 150ms ease;
            --transition-base: 250ms ease;
        }

        /* ========================================
           RESET & BASE
           ======================================== */

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ========================================
           TYPOGRAPHY
           ======================================== */

        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            line-height: 1.2;
            color: var(--text-primary);
        }

        h1 { font-size: 2.5rem; letter-spacing: -0.02em; }
        h2 { font-size: 1.75rem; letter-spacing: -0.01em; }
        h3 { font-size: 1.25rem; }
        h4 { font-size: 1.1rem; }

        p {
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        a:hover {
            color: var(--accent-glow);
        }

        code, .code {
            font-family: var(--font-mono);
            font-size: 0.9em;
            color: var(--code);
            background: rgba(255, 215, 0, 0.06);
            padding: 2px 6px;
            border-radius: var(--radius-sm);
        }

        /* ========================================
           LAYOUT
           ======================================== */

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 var(--space-lg);
        }

        .section {
            padding: var(--space-3xl) 0;
        }

        .section-header {
            margin-bottom: var(--space-xl);
        }

        .section-header h2 {
            font-size: 1.75rem;
            margin-bottom: var(--space-sm);
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* ========================================
           NAVIGATION
           ======================================== */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .navbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-md) var(--space-lg);
            max-width: 960px;
            margin: 0 auto;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .navbar-links {
            display: flex;
            gap: var(--space-lg);
            list-style: none;
        }

        .navbar-links a {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color var(--transition-fast);
            padding: var(--space-xs) 0;
            border-bottom: 2px solid transparent;
        }

        .navbar-links a:hover,
        .navbar-links a.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent);
        }

        /* ========================================
           BUTTONS
           ======================================== */

        .btn {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: all var(--transition-base);
            text-decoration: none;
            font-family: var(--font-sans);
            letter-spacing: 0.01em;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 14px rgba(108, 92, 231, 0.3);
        }

        .btn-primary:hover {
            background: #7c6ff7;
            color: white;
            box-shadow: var(--shadow-button);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
            border-color: var(--border-light);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }

        .btn-ghost:hover {
            background: var(--surface);
            color: var(--text-primary);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        /* ========================================
           CARDS
           ======================================== */

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            transition: all var(--transition-base);
        }

        .card:hover {
            border-color: var(--border-light);
            box-shadow: var(--shadow-card);
        }

        .card-featured {
            border-color: var(--accent-border);
            box-shadow: var(--shadow-glow);
        }

        /* ========================================
           TAGS
           ======================================== */

        .tag {
            display: inline-block;
            padding: 3px 10px;
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: var(--radius-full);
            background: rgba(136, 136, 160, 0.08);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            font-family: var(--font-mono);
            letter-spacing: 0.02em;
        }

        .tag-accent {
            background: var(--accent-bg);
            color: var(--accent-glow);
            border-color: var(--accent-border);
        }

        /* ========================================
           SKILL BADGES
           ======================================== */

        .skill-item {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
            font-size: 0.88rem;
            font-weight: 500;
            border-radius: var(--radius-full);
            transition: all var(--transition-fast);
            cursor: default;
        }

        .skill-expert {
            background: var(--accent-bg);
            color: var(--accent-glow);
            border: 1px solid var(--accent-border);
        }

        .skill-proficient {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }

        .skill-comfortable {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .skill-core {
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        /* ========================================
           GRID
           ======================================== */

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-lg);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-lg);
        }

        /* ========================================
           UTILITIES
           ======================================== */

        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); }
        .text-secondary { color: var(--text-secondary); }
        .text-accent { color: var(--accent-glow); }
        .mt-sm { margin-top: var(--space-sm); }
        .mt-md { margin-top: var(--space-md); }
        .mt-lg { margin-top: var(--space-lg); }
        .mt-xl { margin-top: var(--space-xl); }
        .mb-sm { margin-bottom: var(--space-sm); }
        .mb-md { margin-bottom: var(--space-md); }
        .mb-lg { margin-bottom: var(--space-lg); }
        .gap-sm { gap: var(--space-sm); }
        .gap-md { gap: var(--space-md); }
        .flex { display: flex; }
        .flex-wrap { flex-wrap: wrap; }
        .items-center { align-items: center; }

        .divider {
            height: 1px;
            background: var(--border);
            margin: var(--space-xl) 0;
        }

        .glow-text {
            text-shadow: 0 0 20px rgba(108, 92, 231, 0.15);
        }

        /* ========================================
           FOOTER
           ======================================== */

        .footer {
            border-top: 1px solid var(--border);
            padding: var(--space-xl) 0;
            text-align: center;
        }

        .footer p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin: 0;
        }

        /* ========================================
           RESPONSIVE
           ======================================== */

        @media (max-width: 768px) {
            .container {
                padding: 0 var(--space-md);
            }

            h1 { font-size: 2rem; }
            h2 { font-size: 1.5rem; }

            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }

            .navbar-links {
                gap: var(--space-md);
            }

            .navbar-links a {
                font-size: 0.85rem;
            }

            .section {
                padding: var(--space-2xl) 0;
            }
        }

        /* ========================================
           SELECTION
           ======================================== */

        ::selection {
            background: rgba(108, 92, 231, 0.3);
            color: white;
        }

        /* ========================================
           SCROLLBAR
           ======================================== */

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-light);
        }
    </style>
</head>
<body>
{% include 'navbar.html' %}

<main>
    {% block content %}{% endblock %}
</main>

{% include 'footer.html' %}
</body>
</html>
